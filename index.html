<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الفرنساوي</title>
<meta name="theme-color" content="#3A4EE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1226" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فرنساوي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Layout: one narrow column. Home = hero with daily stats, then Test / Training / Mistakes cards.
   Every level has its own color (A1 green, A2 teal, B1 blue, B2 violet, C1 orange). */
:root {
  color-scheme: light dark;
  --bg: #F4F6FF; --surface: #FFFFFF; --surface2: #ECEFFF; --fg: #131A3B; --muted: #5A6489; --line: #DCE1F5;
  --primary: #3A4EE8; --primary-ink: #FFFFFF; --primary-soft: #E4E8FF; --hero-tile: rgba(255,255,255,.18);
  --good: #0E9F6E; --good-bg: #DDF5EA; --bad: #D6403A; --bad-bg: #FCE4E2; --gold: #F5A524;
  --a1: #12A150; --a2: #0E9AA7; --b1: #3A6BEA; --b2: #8A55E8; --c1: #EE6A1C;
  --t-test: #8A55E8; --t-train: #0E9AA7; --t-review: #EE6A1C;
  --font-fr: "Fraunces", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1226; --surface: #161D3A; --surface2: #1F2850; --fg: #EAEEFF; --muted: #9BA6CF; --line: #2B3560;
    --primary: #7C8CFF; --primary-ink: #0D1226; --primary-soft: #232D5E; --hero-tile: rgba(13,18,38,.16);
    --good: #4AD6A0; --good-bg: #10362B; --bad: #FF8F88; --bad-bg: #3D2024; --gold: #FFC857;
    --a1: #3FCB82; --a2: #3CCBD6; --b1: #7FA2FF; --b2: #B997FF; --c1: #FF9D5C;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; font-size: 16px; line-height: 1.6;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
#app { max-width: 560px; margin: 0 auto; padding-top: 14px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 12px; }
.fr { font-family: var(--font-fr); }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.small { font-size: 14px; }
svg { display: block; }
.lvl-A0, .lvl-A1 { --lv: var(--a1); } .lvl-A2 { --lv: var(--a2); } .lvl-B1 { --lv: var(--b1); }
.lvl-B2 { --lv: var(--b2); } .lvl-C1 { --lv: var(--c1); }

/* home */
.hero { background: var(--primary); color: var(--primary-ink); border-radius: 22px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-weight: 600; font-size: 17px; opacity: .92; letter-spacing: .02em; }
.hero h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.trico { display: flex; height: 5px; width: 64px; border-radius: 99px; overflow: hidden; }
.trico i { flex: 1; } .trico i:nth-child(1) { background: #7C94FF; } .trico i:nth-child(2) { background: #fff; } .trico i:nth-child(3) { background: #FF5A63; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--hero-tile); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; line-height: 1.3; min-width: 0; }
.stat b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; opacity: .92; }
.goal { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.goal .row { display: flex; justify-content: space-between; }
.goal .bar { background: var(--hero-tile); } .goal .bar > i { background: var(--primary-ink); }
.mode { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-align: start; }
.mode:active, .lesson:active, .cta:active { transform: scale(.985); }
.mode .tile { flex: none; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: var(--tile); color: #fff; }
.mode .tile svg { width: 26px; height: 26px; }
.mode .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mode strong { font-size: 18px; font-weight: 700; }
.mode small { color: var(--muted); font-size: 14px; line-height: 1.5; }
.mode .chev { color: var(--muted); width: 20px; height: 20px; flex: none; }
.mode[disabled] { opacity: .55; cursor: not-allowed; }

/* shared */
.topbar, .qtop { display: flex; align-items: center; gap: 10px; }
.topbar h2 { margin: 0; font-size: 21px; font-weight: 800; flex: 1; }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.icon-btn svg { width: 20px; height: 20px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; flex: 1; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s ease; } }
.cta { width: 100%; background: var(--primary); color: var(--primary-ink); border-radius: 14px; padding: 13px 18px; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.cta svg { width: 20px; height: 20px; }
.cta[disabled] { opacity: .4; cursor: not-allowed; }
.cta.alt { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.cta.good { background: var(--good); color: #fff; }
.pill { background: var(--surface2); color: var(--muted); font-weight: 700; font-size: 13px; padding: 2px 12px; border-radius: 99px; }
.pill.lv { background: var(--lv); color: #fff; font-weight: 800; }

/* training */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface2); padding: 4px; border-radius: 14px; }
.seg button { padding: 8px 4px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.lvs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvchip { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.lvchip b { font-family: var(--font-fr); font-size: 20px; font-weight: 800; color: var(--lv); }
.lvchip small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvchip.on { border-color: var(--lv); background: color-mix(in srgb, var(--lv) 13%, var(--surface)); }
.lesson { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; text-align: start; }
.lesson .num { width: 42px; height: 42px; border-radius: 50%; background: var(--lv); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; font-variant-numeric: tabular-nums; }
.lesson .lt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.lesson small { color: var(--muted); font-size: 13px; }
.stars { display: flex; gap: 2px; flex: none; } .stars svg { width: 20px; height: 20px; }
.stars.big svg { width: 44px; height: 44px; } .stars.big { gap: 6px; justify-content: center; }
.sec-title { margin: 6px 0 -4px; font-size: 14px; color: var(--muted); font-weight: 700; }
.lists { display: flex; flex-direction: column; gap: 10px; }

/* quiz */
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 42px; text-align: end; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qmeta { display: flex; gap: 8px; align-items: center; }
.prompt { font-family: var(--font-fr); font-size: 22px; line-height: 1.5; margin: 0; text-wrap: balance; }
.passage { font-family: var(--font-fr); font-size: 18px; line-height: 1.6; background: var(--primary-soft); border-radius: 12px; padding: 12px 14px; margin: 0; }
.script { font-family: var(--font-fr); font-size: 17px; background: var(--primary-soft); border-radius: 12px; padding: 10px 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 12px; font-size: 17px; }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--surface2); display: grid; place-items: center; font-family: var(--font-fr); font-weight: 800; font-size: 14px; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); } .opt.sel .k { background: var(--primary); color: var(--primary-ink); }
.opt.ok { border-color: var(--good); background: var(--good-bg); } .opt.ok .k { background: var(--good); color: #fff; }
.opt.no { border-color: var(--bad); background: var(--bad-bg); } .opt.no .k { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.fb.ok { background: var(--good-bg); color: var(--good); } .fb.no { background: var(--bad-bg); color: var(--bad); }
.audio { display: flex; flex-wrap: wrap; gap: 8px; }
.play { display: flex; align-items: center; gap: 8px; background: var(--primary); color: var(--primary-ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.play svg { width: 16px; height: 16px; }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 600; }
.ghost.small { padding: 5px 14px; font-size: 14px; }
.ghost.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.audio { align-items: center; } .audio .lbl { min-width: 52px; }
.vsel { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; }

/* results */
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 16px; display: flex; flex-direction: column; gap: 14px; }
.res .center { text-align: center; margin: 0; }
.res h2 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
.bigbadge { width: 128px; height: 128px; border-radius: 50%; background: var(--lv); color: #fff; display: grid; place-items: center; margin: 0 auto; font-family: var(--font-fr); font-size: 54px; font-weight: 800; }
.rowbar { display: grid; grid-template-columns: 78px 1fr 44px; gap: 10px; align-items: center; font-size: 14px; }
.rowbar .bar > i { background: var(--lv, var(--primary)); }
.rowbar .n { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.wr { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
details.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; }
details.card summary { cursor: pointer; font-weight: 700; }
details.card .in { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; z-index: 60; text-align: center; }
.sheet { position: fixed; inset: 0; background: rgba(5,8,25,.7); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); overflow-y: auto; }
.sheet-card { background: var(--surface); border-radius: 22px; padding: 16px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow-y: auto; }
.sheet-card img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 14px; background: var(--surface2); }
.sheet-card textarea { width: 100%; height: 84px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 14px; resize: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <img id="shImg" alt="نتيجتك" hidden>
    <p class="note" id="shHint"></p>
    <textarea id="shText" readonly aria-label="نص المشاركة"></textarea>
    <button class="cta" data-a="copy-share">نسخ النص</button>
    <button class="cta alt" data-a="close-sheet">إغلاق</button>
  </div>
</div>

<script src="questions.js"></script>
<script>
/* ============ ثوابت ============ */
var LNX = Object.assign({A0: 'مبتدئ جدًا'}, LN);
var LVCOLOR = {A0: '#22B866', A1: '#22B866', A2: '#1FB5C2', B1: '#4C7DFF', B2: '#9B6BFF', C1: '#FF8A3D'};
var TRACKS = ['g', 'v', 'r', 'l'];
var GOAL = 10;
var LESSON_SIZE = 7;

/* ============ التخزين ============ */
var KEY = 'fr-trainer-v2';
function readLS(k){ try { return JSON.parse(localStorage.getItem(k)) || null; } catch (e) { return null; } }
var DB = Object.assign({wrong: [], best: null, tests: 0, xp: 0, streak: 0, last: '', today: {d: '', n: 0}, lessons: {}},
  readLS('fr-trainer-v1') || {}, readLS(KEY) || {});
if (!Array.isArray(DB.wrong)) DB.wrong = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
function dayStr(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayStr(){ return dayStr(new Date()); }
function yestStr(){ var d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); }
function streakNow(){ return (DB.last === todayStr() || DB.last === yestStr()) ? DB.streak : 0; }
function todayCount(){ return DB.today && DB.today.d === todayStr() ? DB.today.n : 0; }
function bump(){
  var t = todayStr();
  if (!DB.today || DB.today.d !== t) DB.today = {d: t, n: 0};
  DB.today.n++;
  if (DB.last !== t) { DB.streak = (DB.last === yestStr()) ? DB.streak + 1 : 1; DB.last = t; }
}

/* ============ أدوات ============ */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 2600);
}
var IC = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
  test: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 011 1v1a1 1 0 01-1 1H9a1 1 0 01-1-1V5a1 1 0 011-1zM8 5.5H6.5A1.5 1.5 0 005 7v12.5A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V7a1.5 1.5 0 00-1.5-1.5H16M8.5 14l2.5 2.5 4.5-5"/></svg>',
  train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 006.5 23H20v-5M8.5 8h7"/></svg>',
  review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>'
};
function star(on){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="' + (on ? 'var(--gold)' : 'none') + '" stroke="' + (on ? 'var(--gold)' : 'var(--line)') + '" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function stars(n, big){ return '<span class="stars' + (big ? ' big' : '') + '" aria-label="' + n + ' من 3 نجوم">' + [0, 1, 2].map(function(i){ return star(i < n); }).join('') + '</span>'; }

/* ============ الصوت ============ */
var voiceNote = '', voiceTimer = null, showScript = false;
function setNote(t){
  voiceNote = t;
  var el = document.getElementById('vnote');
  if (el) { el.textContent = t; el.hidden = !t; }
}
var FRV = [];
var NOVELTY = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|jester|whisper|bad news|good news|bahh|bells|boing|bubbles|cellos|deranged|hysterical|organ|trinoids|zarvox|albert|fred|junior|kathy|ralph|superstar|wobble)\b/i;
function vscore(v){
  var n = (v.name || '').toLowerCase(), s = 0, l = (v.lang || '').toLowerCase().replace('_', '-');
  if (/natural|neural|online/.test(n)) s += 10;
  if (/premium|enhanced|siri/.test(n)) s += 6;
  if (n.indexOf('google') > -1) s += 5;
  if (/thomas|amélie|amelie|audrey|aurélie|aurelie|denise|henri|vivienne|eloise|hortense|julie|paul/.test(n)) s += 3;
  if (l === 'fr-fr') s += 3;
  if (/compact|espeak/.test(n)) s -= 4;
  if (NOVELTY.test(n)) s -= 20;
  return s;
}
function loadVoices(){
  try {
    FRV = (speechSynthesis.getVoices() || []).filter(function(v){ return v.lang && v.lang.toLowerCase().replace('_', '-').indexOf('fr') === 0; });
    FRV.sort(function(a, b){ return vscore(b) - vscore(a); });
  } catch (e) { FRV = []; }
}
function chosenVoice(){
  for (var i = 0; i < FRV.length; i++) if (FRV[i].name === DB.voice) return FRV[i];
  return FRV[0] || null;
}
var RATES = [['بطيء', 0.6], ['واضح', 0.75], ['عادي', 0.9]];
function curRate(){ return DB.rate || 0.75; }
function fileRate(){ return curRate() <= 0.61 ? 0.8 : 1; }
function failVoice(msg){ clearTimeout(voiceTimer); showScript = true; render(true); setNote(msg); }
/* تشغيل الصوت: ملف مسجل audio/q{id}.mp3 لو موجود، وإلا صوت التليفون */
var curAudio = null;
function stopAudio(){
  try { if (curAudio) { curAudio.pause(); curAudio = null; } } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
}
function playQ(){
  var it = S.items[S.i], q = BANK[it.id];
  if (S.mode === 'test') {
    it.plays = it.plays || 0;
    if (it.plays >= 2) { toast('زي الامتحان الحقيقي: مرتين بس'); return; }
    it.plays++; render(true);
  }
  stopAudio();
  var done = false;
  var fallback = function(){ if (done) return; done = true; speak(q.s); };
  try {
    var a = new Audio('audio/q' + q.id + '.mp3'); curAudio = a;
    a.preload = 'auto'; a.playbackRate = fileRate();
    a.onerror = fallback;
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function(err){

/* صوت التليفون: بنقسم الجملة لأجزاء قصيرة عند علامات الترقيم، وكل جزء بيتنطق لوحده، فالنطق يبقى أوضح */
function speak(text){
  clearTimeout(voiceTimer);
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    return failVoice('المتصفح ده مش بيدعم الصوت. اقرأ النص اللي ظهر.');
  }
  loadVoices();
  var voice = chosenVoice();
  try { speechSynthesis.cancel(); } catch (e) {}
  setTimeout(function(){
    try {
      var parts = text.match(/[^,;:.!?]+[,;:.!?]?/g) || [text], started = false, first = true;
      parts.forEach(function(p){
        p = p.trim(); if (!p) return;
        var u = new SpeechSynthesisUtterance(p);
        u.lang = (voice && voice.lang) ? voice.lang : 'fr-FR';
        if (voice) u.voice = voice;
        u.rate = curRate(); u.pitch = 1; u.volume = 1;
        if (first) {
          first = false;
          u.onstart = function(){
            started = true; clearTimeout(voiceTimer);
            setNote(voice ? '' : 'جهازك مفيهوش صوت فرنساوي، فالنطق ممكن يطلع غريب. نزّل اللغة الفرنساوية من إعدادات التليفون ثم "تحويل النص إلى كلام".');
          };
        }
        u.onerror = function(ev){
          if (ev && (ev.error === 'canceled' || ev.error === 'interrupted')) return;
          failVoice('الصوت ما اشتغلش على جهازك. اقرأ النص اللي ظهر، وتأكد إن صوت الوسائط مرفوع.');
        };
        speechSynthesis.speak(u);
      });
      voiceTimer = setTimeout(function(){
        if (!started) failVoice('مفيش صوت خرج. اتأكد إن صوت الوسائط مرفوع وإن الجهاز مش على الصامت. النص ظاهر تحت للقراءة.');
      }, 3000);
      try { speechSynthesis.resume(); } catch (e) {}
    } catch (e) { failVoice('الصوت ما اشتغلش على جهازك. اقرأ النص اللي ظهر.'); }
  }, 120);
}

  var url = shareUrl(), txt = shareText() + ' ' + url;
  var img = document.getElementById('shImg');
  if (S.card && S.card.dataUrl) { img.src = S.card.dataUrl; img.hidden = false; document.getElementById('shHint').textContent = 'اضغط مطولًا على الصورة لحفظها، ثم ابعتها لأصحابك مع النص.'; }
  else { img.hidden = true; document.getElementById('shHint').textContent = 'انسخ النص وابعته لأصحابك.'; }
  var ta = document.getElementById('shText'); ta.value = txt;
  document.getElementById('sheet').hidden = false;
}
function doShare(){
  var url = shareUrl(), txt = shareText(), f = S.card && S.card.file, data = null;
  try { if (f && navigator.canShare && navigator.canShare({files: [f]})) data = {files: [f], text: txt + ' ' + url}; } catch (e) {}
  if (navigator.share) {
    navigator.share(data || {text: txt, url: url}).catch(function(err){ if (!err || err.name !== 'AbortError') openSheet(); });
  } else openSheet();
}
function copyShare(){
  var ta = document.getElementById('shText');
  var done = function(){ toast('اتنسخ النص'); };
  var manual = function(){ ta.focus(); ta.select(); try { ta.setSelectionRange(0, 9999); } catch (e) {} toast('اضغط نسخ من القائمة اللي ظهرت'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, manual); else manual();
}

/* ============ الأحداث ============ */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.rate) { DB.rate = parseFloat(t.dataset.rate); save(); return render(true); }
  if (t.dataset.pos !== undefined) return pick(+t.dataset.pos);
  if (t.dataset.tr) { T.tr = t.dataset.tr; return render(true); }
  if (t.dataset.lv) { T.lv = t.dataset.lv; return render(true); }
  if (t.dataset.lesson !== undefined) return startLesson(T.tr, T.lv, +t.dataset.lesson);
  var a = t.dataset.a; if (!a) return;
  if (a === 'home') { stopAudio(); go('home'); }
  else if (a === 'back-home') go('train');
  else if (a === 'test') startTest();
  else if (a === 'train') go('train');
  else if (a === 'review') startReview();
  else if (a === 'quick') startQuick(T.lv);
  else if (a === 'next') next();
  else if (a === 'again') { if (S.mode === 'lesson') startLesson(S.tr, S.lv, S.k); else startQuick(S.qlv || T.lv); }
  else if (a === 'nextlesson') startLesson(S.tr, S.lv, S.k + 1);
  else if (a === 'exit') {
    if (S.mode === 'test' && !exitArmed) { exitArmed = true; toast('اضغط تاني للخروج، وهتخسر تقدم الاختبار'); setTimeout(function(){ exitArmed = false; }, 3000); return; }
    exitArmed = false; stopAudio();
    go(S.mode === 'test' || S.mode === 'review' ? 'home' : 'train');
  }
  else if (a === 'play') playQ();
  else if (a === 'script') { showScript = !showScript; render(true); }
  else if (a === 'share') doShare();
  else if (a === 'copy-share') copyShare();
  else if (a === 'close-sheet') document.getElementById('sheet').hidden = true;
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'voicesel') { var v = FRV[parseInt(e.target.value, 10)]; if (v) { DB.voice = v.name; save(); } }
});
try {
  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', function(){ loadVoices(); if (view === 'quiz' && S && BANK[S.items[S.i].id].t === 'l') render(true); });
  }
} catch (e) {}
render();
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
