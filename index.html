<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الفرنساوي</title>
<meta name="theme-color" content="#1F46D6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}
/* Layout: one narrow column, phone first. Header strip, then one card per screen. */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --fg: #12203A;
  --muted: #5B6B86;
  --line: #D7DEEA;
  --accent: #1F46D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6ECFD;
  --good: #12805C;
  --good-bg: #E2F5EC;
  --bad: #C4332B;
  --bad-bg: #FCE7E5;
  --font-ui: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-fr: "Fraunces", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1626; --surface: #16213A; --fg: #E8EEFA; --muted: #9AA9C4; --line: #2A3856;
    --accent: #7C9BFF; --accent-ink: #0E1626; --accent-soft: #1C2B52;
    --good: #4FD1A1; --good-bg: #12342B; --bad: #FF8A80; --bad-bg: #3B1E22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1626; --surface: #16213A; --fg: #E8EEFA; --muted: #9AA9C4; --line: #2A3856;
  --accent: #7C9BFF; --accent-ink: #0E1626; --accent-soft: #1C2B52;
  --good: #4FD1A1; --good-bg: #12342B; --bad: #FF8A80; --bad-bg: #3B1E22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.6;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.fr { font-family: var(--font-fr); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; }
.badge { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; }
.muted { color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { padding: 8px 0 4px; display: flex; flex-direction: column; gap: 6px; }
.hero .eyebrow { font-family: var(--font-fr); font-weight: 500; color: var(--accent); font-size: 18px; letter-spacing: .02em; }
.hero h1 { margin: 0; font-size: 34px; line-height: 1.2; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; text-align: start; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.btn strong { font-size: 17px; }
.btn small { color: var(--muted); font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary small { color: var(--accent-ink); opacity: .85; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.cta { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; width: 100%; }
.cta[disabled] { opacity: .45; cursor: not-allowed; }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
h2 { margin: 0; font-size: 20px; text-wrap: balance; }
h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
.prompt { font-family: var(--font-fr); font-size: 22px; line-height: 1.45; margin: 0; text-wrap: balance; }
.passage { font-family: var(--font-fr); font-size: 18px; line-height: 1.6; background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: start; font-size: 17px; width: 100%; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 600; }
.opt.no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.audio { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.audio svg { width: 14px; height: 14px; fill: currentColor; margin-inline-end: 6px; vertical-align: -1px; }
.script { font-family: var(--font-fr); font-size: 17px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.lv { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.lv b { font-family: var(--font-fr); }
.lv .n { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.big { font-family: var(--font-fr); font-size: 56px; line-height: 1; color: var(--accent); font-weight: 700; }
.wr { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.wr:first-of-type { border-top: 0; padding-top: 0; }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s ease; } }
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="ar" id="app"></div>

<script>
/* ============ بنك الأسئلة ============ */
/* الإجابة الصحيحة دايمًا أول اختيار هنا، والتطبيق بيخلط الترتيب وقت العرض */
const LV = ['A1','A2','B1','B2','C1'];
const LN = {A1:'مبتدئ', A2:'أساسي', B1:'متوسط', B2:'فوق المتوسط', C1:'متقدم'};
const TN = {g:'قواعد', v:'مفردات', r:'قراءة', l:'استماع'};
const BANK = [];
function Q(l,t,q,o,e,x){ BANK.push(Object.assign({id:BANK.length,l:l,t:t,q:q,o:o,e:e},x||{})); }

/* ---- A1 ---- */
Q('A1','g','Je ___ étudiant.',['suis','es','est','sommes'],'مع الضمير je نستخدم suis من الفعل être.');
Q('A1','g','Elle ___ deux enfants.',['a','as','ai','ont'],'الفعل avoir مع elle يبقى a.');
Q('A1','g','___ maison est grande.',['La','Le','Les','Un'],'كلمة maison مؤنثة، فنستخدم la.');
Q('A1','g','Nous ___ au restaurant ce soir.',['allons','allez','vont','vais'],'الفعل aller مع nous يبقى allons.');
Q('A1','v','ماذا تعني كلمة « Merci » ؟',['شكرًا','من فضلك','آسف','مع السلامة'],'Merci معناها شكرًا.');
Q('A1','v','Le contraire de « grand » est :',['petit','gros','long','beau'],'عكس grand (كبير) هو petit (صغير).');
Q('A1','r','Où habite Karim ?',['Au Caire','À Paris','À Alger','À Lyon'],'النص بيقول: J\'habite au Caire.',{p:'Je m\'appelle Karim. J\'ai vingt ans. J\'habite au Caire avec ma famille. J\'aime le football.'});
Q('A1','r','Qu\'est-ce que Marie achète ?',['Du pain et un croissant','Du lait','Des fruits','Du fromage'],'baguettes و croissant يعني خبز وكرواسون.',{p:'Marie est à la boulangerie. Elle achète deux baguettes et un croissant.'});
Q('A1','l','كم عمر صوفي ؟',['25 سنة','15 سنة','35 سنة','20 سنة'],'vingt-cinq = 25.',{s:'Bonjour, je m\'appelle Sophie. J\'ai vingt-cinq ans.'});
Q('A1','l','ما الساعة ؟',['8 صباحًا','8 مساءً','9 صباحًا','7 صباحًا'],'huit heures du matin = الثامنة صباحًا.',{s:'Il est huit heures du matin.'});

/* ---- A2 ---- */
Q('A2','g','Hier, je ___ au cinéma.',['suis allé','ai allé','vais aller','irai'],'الفعل aller في الماضي المركب يستخدم être: je suis allé.');
Q('A2','g','Tu connais Paul ? Oui, je ___ connais.',['le','lui','la','les'],'Paul مذكر ومفعول مباشر، فنستخدم le.');
Q('A2','g','Il y a ___ eau dans le verre.',['de l\'','du','de la','des'],'eau تبدأ بحرف متحرك، فنقول de l\'eau.');
Q('A2','g','Je n\'ai ___ frère.',['pas de','pas des','pas du','pas un'],'في النفي بعد pas نستخدم de بدل un أو une.');
Q('A2','v','Pour acheter un billet de train, on va à la ___.',['gare','plage','banque','pharmacie'],'gare = محطة القطار.');
Q('A2','v','Quel mot désigne le repas du matin ?',['petit-déjeuner','dîner','déjeuner','goûter'],'petit-déjeuner هو فطار الصباح.');
Q('A2','r','Que doit apporter Léa ?',['Un dessert','Une boisson','Des fleurs','Un cadeau'],'Tom كتب: Apporte un dessert.',{p:'Salut Léa ! Samedi, je fais une fête chez moi à 20 heures. Tu peux venir ? Apporte un dessert, s\'il te plaît. Bises, Tom'});
Q('A2','r','Quand le musée est-il fermé ?',['Le lundi','Le dimanche','Le mardi','Le samedi'],'مفتوح من الثلاثاء للأحد، يعني مقفول يوم الاثنين.',{p:'Le musée est ouvert du mardi au dimanche, de 9 h à 18 h. Il est fermé le lundi. L\'entrée coûte 8 euros, gratuite pour les enfants.'});
Q('A2','l','أين تقع المحطة ؟',['مباشرة ثم ثاني شارع يسارًا','يمينًا بعد أول شارع','خلفك','بجانب البنك'],'tout droit = مباشرة، deuxième rue à gauche = ثاني شارع يسار.',{s:'Excusez-moi, pour aller à la gare, c\'est tout droit, puis la deuxième rue à gauche.'});
Q('A2','l','لكم شخص الحجز ؟',['4 أشخاص','6 أشخاص','3 أشخاص','2 شخصان'],'quatre = 4.',{s:'Je voudrais réserver une table pour quatre personnes, demain soir, à dix-neuf heures trente.'});

/* ---- B1 ---- */
Q('B1','g','Si j\'avais plus d\'argent, je ___ une voiture.',['achèterais','achèterai','achète','achetais'],'جملة الشرط غير المحقق: si + imparfait ثم conditionnel.');
Q('B1','g','Il faut que tu ___ à l\'heure.',['sois','es','seras','étais'],'après il faut que نستخدم subjonctif: sois.');
Q('B1','g','C\'est le livre ___ je t\'ai parlé.',['dont','que','qui','où'],'parler de نستخدم معها الضمير الموصول dont.');
Q('B1','g','Nous ___ en train de dîner quand le téléphone a sonné.',['étions','sommes','avons été','serons'],'الحدث الجاري في الماضي يأخذ imparfait.');
Q('B1','v','« Déménager » signifie :',['Changer de logement','Ranger la maison','Louer une voiture','Décorer'],'déménager = ينتقل لسكن جديد.');
Q('B1','v','Il a perdu son travail : il est au ___.',['chômage','congé','repos','salaire'],'être au chômage = عاطل عن العمل.');
Q('B1','r','Quel inconvénient l\'auteur mentionne-t-il ?',['Les transports sont parfois pleins','Le vélo coûte cher','Le métro est lent','Il n\'y a pas de métro'],'النص يقول إن المواصلات أحيانًا مزدحمة (bondés).',{p:'Depuis que j\'habite en ville, je n\'ai plus besoin de voiture. Je prends le métro ou je vais à vélo. C\'est plus rapide et plus économique, même si les transports sont parfois bondés le matin.'});
Q('B1','r','Que doit faire un candidat avant le 15 mars ?',['Envoyer sa candidature','Passer un examen','Signer un contrat','Visiter l\'entreprise'],'candidatures à envoyer avant le 15 mars.',{p:'L\'entreprise propose un poste de comptable à temps partiel. Le candidat doit avoir deux ans d\'expérience et maîtriser Excel. Les candidatures sont à envoyer avant le 15 mars.'});
Q('B1','l','ما سبب التأخير ؟',['مشكلة تقنية','الطقس','إضراب','حادث'],'problème technique = مشكلة تقنية.',{s:'Le train de Lyon est retardé de vingt minutes en raison d\'un problème technique. Nous vous prions de nous excuser.'});
Q('B1','l','لماذا يفضل المتحدث العمل من البيت ؟',['يوفر وقت التنقل ويركز أكثر','الراتب أعلى','يحب زملاءه','لا يملك مكتبًا'],'قال إنه يكسب وقت المواصلات ويكون أكثر تركيزًا.',{s:'Moi, je préfère travailler à la maison, parce que je gagne du temps sur les transports et je suis plus concentré.'});

/* ---- B2 ---- */
Q('B2','g','Bien qu\'il ___ fatigué, il a continué à travailler.',['soit','est','était','sera'],'بعد bien que نستخدم subjonctif: soit.');
Q('B2','g','Les lettres que j\'ai ___ sont arrivées hier.',['écrites','écrit','écrite','écrits'],'مع avoir يتفق اسم المفعول مع المفعول المتقدم: lettres مؤنث جمع، فنكتب écrites.');
Q('B2','g','Je doute qu\'il ___ la vérité.',['dise','dit','dira','disait'],'douter que يأخذ subjonctif.');
Q('B2','g','Si tu avais étudié, tu ___ l\'examen.',['aurais réussi','réussirais','as réussi','auras réussi'],'شرط في الماضي: si + plus-que-parfait ثم conditionnel passé.');
Q('B2','v','Le contraire d\'« un avantage » est :',['un inconvénient','un bénéfice','un atout','un gain'],'عكس avantage (ميزة) هو inconvénient (عيب).');
Q('B2','v','« Remettre à plus tard » se dit :',['reporter','rapporter','supporter','emporter'],'reporter = يؤجل.');
Q('B2','r','Quelle solution les chercheurs proposent-ils ?',['Un modèle hybride','Le télétravail total','Le retour au bureau','Réduire les salaires'],'الباحثون يقترحون النموذج الهجين.',{p:'Selon une étude récente, le télétravail augmenterait la productivité, mais il fragiliserait les liens entre collègues. Les chercheurs recommandent donc un modèle hybride.'});
Q('B2','r','Pourquoi certains commerçants critiquent-ils la mesure ?',['Ils craignent de perdre des clients','Ils ont peur de la pollution','Ils veulent plus d\'espaces verts','Ils soutiennent le maire'],'craignent une baisse de leur clientèle = يخافون من خسارة العملاء.',{p:'Le maire a annoncé la piétonnisation du centre-ville, une mesure saluée par les écologistes mais critiquée par certains commerçants, qui craignent une baisse de leur clientèle.'});
Q('B2','l','ماذا حدث لمعدل البطالة ؟',['انخفض قليلًا','ارتفع كثيرًا','لم يتغير','اختفى'],'a légèrement baissé = انخفض قليلًا.',{s:'Malgré les prévisions pessimistes, le taux de chômage a légèrement baissé ce trimestre, ce qui a surpris les économistes.'});
Q('B2','l','لماذا لم يرافقه المتحدث ؟',['كان عنده تقرير عاجل','كان مريضًا','نسي الموعد','كان مسافرًا'],'قال إنه بقي في المكتب لإنهاء تقرير عاجل.',{s:'J\'aurais aimé t\'accompagner, mais j\'ai dû rester au bureau pour terminer un rapport urgent.'});

/* ---- C1 ---- */
Q('C1','g','Quoi qu\'il ___, je ne changerai pas d\'avis.',['dise','dit','disait','dira'],'quoi que يأتي بعده subjonctif.');
Q('C1','g','Il l\'a fait sans que nous le ___.',['sachions','savons','savions','saurons'],'sans que يأخذ subjonctif: sachions.');
Q('C1','g','Autant il est brillant, ___ il est paresseux.',['autant','tant','aussi','si'],'التعبير الثابت: autant ... autant ...');
Q('C1','g','Il faudrait que vous ___ plus attentifs.',['soyez','êtes','seriez','serez'],'il faudrait que يأخذ subjonctif présent: soyez.');
Q('C1','v','« Être sur le point de » signifie :',['Être près de faire quelque chose','Avoir fini','Refuser de faire','Ne jamais faire'],'être sur le point de = على وشك أن يفعل.');
Q('C1','v','Un synonyme de « néanmoins » est :',['cependant','donc','ainsi','car'],'néanmoins و cependant معناهم "مع ذلك".');
Q('C1','v','Un « euphémisme » est :',['Une expression qui atténue une réalité pénible','Une exagération','Une question rhétorique','Un proverbe'],'الـ euphémisme هو تلطيف للتعبير عن شيء مؤلم.');
Q('C1','r','Que traduit le « slow living » selon le texte ?',['Une remise en cause de l\'accélération des rythmes de vie','Une simple mode passagère','Un retour à l\'agriculture','Une politique gouvernementale'],'النص يقول إنه ليس مجرد موضة بل مراجعة لتسارع إيقاع الحياة.',{p:'Loin de se limiter à une simple mode, le mouvement du « slow living » traduit une remise en cause de l\'accélération des rythmes de vie, perçue comme source d\'épuisement collectif.'});
Q('C1','r','Quelle est la position de l\'auteur ?',['Il critique l\'usage irréfléchi de la technique','Il condamne tout progrès','Il défend l\'efficacité absolue','Il refuse de se prononcer'],'الكاتب لا يدين التقدم نفسه، بل الاستخدام غير المدروس له.',{p:'L\'auteur se défend de vouloir condamner le progrès technique ; il en dénonce plutôt l\'usage irréfléchi, qui érige l\'efficacité en valeur suprême.'});
Q('C1','l','ماذا يتوقع المتحدث عن الإصلاح ؟',['سيواجه مقاومة شديدة','سيمر بسهولة','سيُلغى فورًا','لن يلاحظه أحد'],'se heurtera à de vives résistances = سيصطدم بمقاومة شديدة.',{s:'Il va sans dire que cette réforme, aussi ambitieuse soit-elle, se heurtera à de vives résistances.'});
Q('C1','l','ما موقف المتحدث من النتائج ؟',['مشجعة لكن الحكم النهائي مبكر','سيئة جدًا','نهائية ومؤكدة','لا تهمه'],'prématuré d\'en tirer des conclusions définitives = من المبكر الحكم النهائي.',{s:'Certes, les résultats sont encourageants, mais il serait prématuré d\'en tirer des conclusions définitives.'});

/* ============ دفعة ثانية من الأسئلة ============ */
function G(l,q,o,e){ Q(l,'g',q,o,e); }
function V(l,q,o,e){ Q(l,'v',q,o,e); }
function R(l,p,q,o,e){ Q(l,'r',q,o,e,{p:p}); }
function L(l,s,q,o,e){ Q(l,'l',q,o,e,{s:s}); }

/* ---- A1 ---- */
G('A1',"Tu ___ français ?",['parles','parle','parlons','parlent'],'مع tu نضيف s في آخر الفعل: tu parles.');
G('A1',"Ils ___ à la maison.",['sont','est','êtes','suis'],'مع ils نستخدم sont من الفعل être.');
G('A1',"J'___ une voiture.",['ai','suis','as','avons'],'مع j\' نستخدم ai من الفعل avoir.');
G('A1',"C'est ___ ami de Paul.",['un','une','des','la'],'كلمة ami مذكر مفرد، فنستخدم un.');
G('A1',"Vous ___ le café ?",['aimez','aimes','aime','aiment'],'مع vous ينتهي الفعل بـ ez: vous aimez.');
G('A1',"Les enfants ___ à l'école.",['vont','va','allons','allez'],'مع les enfants (ils) نستخدم vont.');
G('A1',"Elle ___ Marie.",["s'appelle","m'appelle","t'appelles","vous appelez"],'مع elle نستخدم s\'appelle.');
G('A1',"Mon père ___ médecin.",['est','suis','sont','es'],'مع الغائب المفرد نستخدم est.');
G('A1',"___ est ton nom ?",['Quel','Quelle','Quels','Que'],'كلمة nom مذكر مفرد، فنستخدم Quel.');
G('A1',"J'habite ___ France.",['en','au','à','dans le'],'مع الدول المؤنثة نستخدم en: en France.');
G('A1',"Je ne mange ___ de viande.",['pas','non','jamais pas','rien'],'النفي: ne ... pas de.');

/* ============ التخزين ============ */
const KEY = 'fr-trainer-v1';
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e) {} }
const DB = Object.assign({wrong:[], best:null, tests:0}, load());
if (!Array.isArray(DB.wrong)) DB.wrong = [];

/* ============ أدوات ============ */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function prep(ids){ return ids.map(function(id){ return {id:id, order:shuffle([0,1,2,3]), pick:null}; }); }
var voiceNote = '', voiceTimer = null;
function setNote(t){
  voiceNote = t;
  var el = document.getElementById('vnote');
  if (el) { el.textContent = t; el.hidden = !t; }
}
function frVoices(){
  var all = [];
  try { all = speechSynthesis.getVoices() || []; } catch(e) {}
  var fr = all.filter(function(v){ return v.lang && v.lang.toLowerCase().replace('_','-').indexOf('fr') === 0; });
  fr.sort(function(a, b){
    function score(v){
      var l = v.lang.toLowerCase().replace('_','-'), s = 0;
      if (l === 'fr-fr') s += 4;
      if (/google|natural|enhanced|premium/i.test(v.name)) s += 2;
      if (v.localService) s += 1;
      return s;
    }
    return score(b) - score(a);
  });
  return fr;
}
function failVoice(msg){
  clearTimeout(voiceTimer);
  showScript = true;
  render(true);
  setNote(msg);
}
function speak(text, rate){
  clearTimeout(voiceTimer);
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    return failVoice('المتصفح ده مش بيدعم الصوت. اقرأ النص اللي ظهر تحت، أو افتح الصفحة من Chrome.');
  }
  var voice = frVoices()[0];
  try { speechSynthesis.cancel(); } catch(e) {}
  setTimeout(function(){
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (voice && voice.lang) ? voice.lang : 'fr-FR';
      u.volume = 1; u.pitch = 1; u.rate = rate;
      if (voice) u.voice = voice;
      u.onstart = function(){
        clearTimeout(voiceTimer);
        setNote(voice ? '' : 'جهازك مفيهوش صوت فرنساوي، فالنطق ممكن يطلع غريب. نزّل اللغة الفرنساوية من إعدادات التليفون ثم "تحويل النص إلى كلام".');
      };
      u.onerror = function(){ failVoice('الصوت ما اشتغلش على جهازك. اقرأ النص اللي ظهر، وتأكد إن صوت الوسائط مرفوع.'); };
      voiceTimer = setTimeout(function(){
        failVoice('مفيش صوت خرج. اتأكد إن صوت الوسائط مرفوع وإن الجهاز مش على الصامت، وجرّب تفتح الصفحة من Chrome. النص ظاهر تحت للقراءة.');
      }, 3000);
      try { speechSynthesis.resume(); } catch(e) {}
      speechSynthesis.speak(u);
    } catch(e) { failVoice('الصوت ما اشتغلش على جهازك. اقرأ النص اللي ظهر.'); }
  }, 120);
}

/* ============ الحالة ============ */
var view = 'home', S = null, P = {lv:'A1', ty:'all'}, showScript = false;

function startPlacement(){
  var ids = [];
  LV.forEach(function(l){ ids = ids.concat(shuffle(BANK.filter(function(q){ return q.l === l; })).slice(0,8).map(function(q){ return q.id; })); });
  S = {mode:'placement', items:prep(ids), i:0}; showScript = false; view = 'quiz'; render();
}
function startPractice(){
  var list = BANK.filter(function(q){
    return (P.lv === 'all' || q.l === P.lv) && (P.ty === 'all' || (P.ty === 'gv' ? (q.t === 'g' || q.t === 'v') : q.t === P.ty));
  });
  if (!list.length) return;
  S = {mode:'practice', items:prep(shuffle(list).slice(0,10).map(function(q){ return q.id; })), i:0}; showScript = false; view = 'quiz'; render();
}
function startReview(){
  var ids = DB.wrong.filter(function(id){ return BANK[id]; });
  if (!ids.length) return;
  S = {mode:'review', items:prep(shuffle(ids)), i:0}; showScript = false; view = 'quiz'; render();
}
function pick(pos){
  var it = S.items[S.i];
  if (S.mode !== 'placement' && it.pick !== null) return;
  it.pick = it.order[pos];
  if (S.mode !== 'placement') {
    var k = DB.wrong.indexOf(it.id);
    if (it.pick === 0) { if (k > -1) DB.wrong.splice(k,1); }
    else if (k === -1) DB.wrong.push(it.id);
    save();
  }
  render();
}
function next(){
  showScript = false; voiceNote = '';
  try { speechSynthesis.cancel(); } catch(e) {}
  if (S.i < S.items.length - 1) { S.i++; render(); return; }
  if (S.mode === 'placement') {
    S.items.forEach(function(it){ if (it.pick !== 0 && DB.wrong.indexOf(it.id) === -1) DB.wrong.push(it.id); else if (it.pick === 0) { var k = DB.wrong.indexOf(it.id); if (k > -1) DB.wrong.splice(k,1); } });
    DB.tests += 1; DB.best = placementLevel().label; save();
  }
  view = 'result'; render();
}
function placementLevel(){
  var per = {}; LV.forEach(function(l){ per[l] = {ok:0, n:0}; });
  S.items.forEach(function(it){ var q = BANK[it.id]; per[q.l].n++; if (it.pick === 0) per[q.l].ok++; });
  var passed = null;
  for (var i=0;i<LV.length;i++){ var p = per[LV[i]]; if (p.n && p.ok / p.n >= 0.6) passed = LV[i]; else break; }
  return {per:per, label: passed || 'قبل A1'};
}

/* ============ العرض ============ */
function render(keep){
  var app = document.getElementById('app');
  var y = window.pageYOffset || 0;
  if (view === 'home') app.innerHTML = homeHTML();
  else if (view === 'practice') app.innerHTML = practiceHTML();
  else if (view === 'quiz') app.innerHTML = quizHTML();
  else app.innerHTML = resultHTML();
  window.scrollTo(0, keep === true ? y : 0);
}

    '<p>' + BANK.length + ' سؤال من A1 لحد C1: قواعد ومفردات وقراءة واستماع، للتحضير لاختبارات DELF وTCF.</p></div>' +
    '<button class="btn primary" data-a="placement"><strong>اختبار تحديد المستوى</strong><small>40 سؤال، 8 من كل مستوى، والنتيجة في الآخر</small></button>' +
    '<button class="btn" data-a="practice"><strong>تدريب حسب المستوى</strong><small>اختار المستوى ونوع الأسئلة، وتشوف الشرح بعد كل سؤال</small></button>' +
    '<button class="btn" data-a="review"' + (DB.wrong.length ? '' : ' disabled') + '><strong>مراجعة أخطائي</strong><small>' + (DB.wrong.length ? DB.wrong.length + ' سؤال غلطت فيهم، أعد حلهم' : 'مفيش أخطاء محفوظة لسه') + '</small></button>' + best;
}

    '<button class="cta" data-a="go-practice"' + (count ? '' : ' disabled') + '>ابدأ التدريب</button></div>';

function quizHTML(){
  var it = S.items[S.i], q = BANK[it.id], n = S.items.length;
  var instant = S.mode !== 'placement', done = it.pick !== null;
  var html = '<div class="top"><button class="link" data-a="home">الرئيسية</button><span class="muted">سؤال ' + (S.i + 1) + ' من ' + n + '</span></div>' +
    '<div class="bar"><i style="width:' + Math.round(S.i / n * 100) + '%"></i></div><div class="card">' +
    '<div class="top"><span class="badge fr">' + q.l + '</span><span class="muted">' + TN[q.t] + '</span></div>';
  if (q.t === 'l') {
    html += '<div class="audio"><button class="ghost" data-a="play"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg>استمع</button>' +
      '<button class="ghost" data-a="slow">ببطء</button><button class="ghost" data-a="script">' + (showScript ? 'أخفِ النص' : 'اعرض النص') + '</button></div>';
    html += '<p class="note fb no" id="vnote"' + (voiceNote ? '' : ' hidden') + '>' + esc(voiceNote) + '</p>';
    if (showScript || (instant && done)) html += '<div class="script" dir="ltr" lang="fr">' + esc(q.s) + '</div>';
  }
  if (q.p) html += '<p class="passage" dir="ltr" lang="fr">' + esc(q.p) + '</p>';
  html += '<p class="prompt" dir="auto">' + esc(q.q) + '</p><div class="opts">';
  it.order.forEach(function(real, pos){
    var c = 'opt';
    if (instant && done) { if (real === 0) c += ' ok'; else if (real === it.pick) c += ' no'; }
    else if (it.pick === real) c += ' sel';
    html += '<button class="' + c + '" data-pos="' + pos + '"' + (instant && done ? ' disabled' : '') + ' dir="auto">' + esc(q.o[real]) + '</button>';
  });
  html += '</div>';
  if (instant && done) html += '<div class="fb ' + (it.pick === 0 ? 'ok' : 'no') + '"><b>' + (it.pick === 0 ? 'صح.' : 'غلط.') + '</b> ' + esc(q.e) + '</div>';
  html += '<button class="cta" data-a="next"' + (done ? '' : ' disabled') + '>' + (S.i === n - 1 ? 'إنهاء' : 'التالي') + '</button></div>';
  return html;
}

      '<p class="muted">جاوبت صح على ' + ok + ' من ' + total + '.</p>' +
      LV.map(function(l){ var p = r.per[l]; return '<div class="lv"><b>' + l + '</b><div class="bar"><i style="width:' + Math.round(p.ok / p.n * 100) + '%"></i></div><span class="n">' + p.ok + '/' + p.n + '</span></div>'; }).join('') +
      '<p class="note">النتيجة تقريبية وبتساعدك تعرف تبدأ منين، وليست بديلًا عن امتحان DELF أو TCF الرسمي.</p></div>';

    html += '<div class="card"><h2>أخطاؤك</h2>' + wrong.map(function(it){
      var q = BANK[it.id];
      return '<div class="wr"><span class="prompt" dir="auto" style="font-size:18px">' + esc(q.q) + '</span>' +
        '<span class="muted">إجابتك: <span dir="auto">' + esc(q.o[it.pick]) + '</span></span>' +
        '<span style="color:var(--good)">الصح: <b dir="auto">' + esc(q.o[0]) + '</b></span><span class="note">' + esc(q.e) + '</span></div>';
    }).join('') + '</div>';
  }
  html += '<button class="cta" data-a="' + (S.mode === 'placement' ? 'placement' : (S.mode === 'review' ? 'review' : 'go-practice')) + '">' + (S.mode === 'placement' ? 'اختبار جديد' : 'جلسة جديدة') + '</button>';
  return html;
}

/* ============ الأحداث ============ */
document.getElementById('app').addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.pos !== undefined) return pick(+t.dataset.pos);
  if (t.dataset.lv) { P.lv = t.dataset.lv; return render(); }
  if (t.dataset.ty) { P.ty = t.dataset.ty; return render(); }
  var a = t.dataset.a;
  if (a === 'home') { try { speechSynthesis.cancel(); } catch(x) {} view = 'home'; render(); }
  else if (a === 'placement') startPlacement();
  else if (a === 'practice') { view = 'practice'; render(); }
  else if (a === 'go-practice') startPractice();
  else if (a === 'review') startReview();
  else if (a === 'next') next();
  else if (a === 'play') speak(BANK[S.items[S.i].id].s, 0.95);
  else if (a === 'slow') speak(BANK[S.items[S.i].id].s, 0.7);
  else if (a === 'script') { showScript = !showScript; render(); }
});
try {
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener('voiceschanged', function(){ speechSynthesis.getVoices(); });
  }
} catch(e) {}
render();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
